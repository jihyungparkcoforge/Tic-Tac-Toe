<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="app">
      <h1 class="title">
        <span class="title-x">Tic</span>-<span class="title-o">Tac</span>-Toe
      </h1>

      <!-- Start screen -->
      <section id="menu-screen" class="card screen">
        <form id="menu-form">
          <fieldset class="option-group">
            <legend>Mode</legend>
            <div class="pills">
              <label class="pill"><input type="radio" name="mode" value="ai" checked /><span>vs AI</span></label>
              <label class="pill"><input type="radio" name="mode" value="pvp" /><span>2 Players</span></label>
            </div>
          </fieldset>

          <div id="ai-options">
            <fieldset class="option-group">
              <legend>Difficulty</legend>
              <div class="pills">
                <label class="pill"><input type="radio" name="difficulty" value="easy" checked /><span>Easy</span></label>
                <label class="pill"><input type="radio" name="difficulty" value="hard" /><span>Hard</span></label>
              </div>
            </fieldset>

            <fieldset class="option-group">
              <legend>Your mark</legend>
              <div class="pills">
                <label class="pill pill-x"><input type="radio" name="mark" value="X" checked /><span>✕ goes first</span></label>
                <label class="pill pill-o"><input type="radio" name="mark" value="O" /><span>◯ goes second</span></label>
              </div>
            </fieldset>
          </div>

          <button type="submit" class="btn btn-primary">Start!</button>
        </form>
      </section>

      <!-- Game screen -->
      <section id="game-screen" class="screen" hidden>
        <p id="status" class="status" aria-live="polite"></p>

        <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe board"></div>

        <div class="scoreboard card">
          <div class="score score-x"><span id="score-x-label" class="score-label">X</span><span id="score-x" class="score-value">0</span></div>
          <div class="score score-draw"><span class="score-label">Draws</span><span id="score-draw" class="score-value">0</span></div>
          <div class="score score-o"><span id="score-o-label" class="score-label">O</span><span id="score-o" class="score-value">0</span></div>
        </div>

        <div class="actions">
          <button id="restart-btn" type="button" class="btn btn-primary">Play again</button>
          <button id="menu-btn" type="button" class="btn btn-secondary">Menu</button>
        </div>
      </section>
    </main>
  </body>
</html>
